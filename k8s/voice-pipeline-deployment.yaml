apiVersion: apps/v1
kind: Deployment
metadata:
  name: voice-pipeline
  namespace: hausa-voice-swarm
  labels:
    app: voice-pipeline
    app.kubernetes.io/part-of: hausa-voice-swarm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: voice-pipeline
  template:
    metadata:
      labels:
        app: voice-pipeline
        app.kubernetes.io/part-of: hausa-voice-swarm
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 300
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: voice-pipeline
          image: hsv-voice-pipeline:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: websocket
              containerPort: 8765
              protocol: TCP
          envFrom:
            - configMapRef:
                name: hsv-config
            - secretRef:
                name: hsv-secrets
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
