apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: voice-pipeline
  namespace: hausa-voice-swarm
  labels:
    app: voice-pipeline
    app.kubernetes.io/part-of: hausa-voice-swarm
spec:
  podSelector:
    matchLabels:
      app: voice-pipeline
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: agent-api
      ports:
        - port: 8000
          protocol: TCP
        - port: 8765
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: agent-api
      ports:
        - port: 8000
          protocol: TCP
    # Allow DNS resolution
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-api
  namespace: hausa-voice-swarm
  labels:
    app: agent-api
    app.kubernetes.io/part-of: hausa-voice-swarm
spec:
  podSelector:
    matchLabels:
      app: agent-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: voice-pipeline
      ports:
        - port: 8000
          protocol: TCP
  egress:
    # CockroachDB
    - to: []
      ports:
        - port: 26257
          protocol: TCP
    # Redis
    - to: []
      ports:
        - port: 6379
          protocol: TCP
    # Kafka
    - to: []
      ports:
        - port: 9092
          protocol: TCP
    # DNS resolution
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
