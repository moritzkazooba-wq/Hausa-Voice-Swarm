apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-adapter-config
  namespace: hausa-voice-swarm
  labels:
    app: prometheus-adapter
    app.kubernetes.io/part-of: hausa-voice-swarm
data:
  config.yaml: |
    rules:
      - seriesQuery: 'hsv_active_voice_sessions{namespace!="",pod!=""}'
        resources:
          overrides:
            namespace:
              resource: namespace
            pod:
              resource: pod
        name:
          matches: "^(.*)$"
          as: "${1}"
        metricsQuery: 'sum(<<.Series>>{<<.LabelMatchers>>}) by (<<.GroupBy>>)'
