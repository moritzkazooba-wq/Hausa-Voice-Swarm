apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: voice-pipeline
  namespace: hausa-voice-swarm
  labels:
    app: voice-pipeline
    app.kubernetes.io/part-of: hausa-voice-swarm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: voice-pipeline
  minReplicas: 2
  maxReplicas: 50
  metrics:
    - type: Pods
      pods:
        metric:
          name: hsv_active_voice_sessions
        target:
          type: AverageValue
          averageValue: "5"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 5
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
