apiVersion: v1
kind: Service
metadata:
  name: voice-pipeline
  namespace: hausa-voice-swarm
  labels:
    app: voice-pipeline
    app.kubernetes.io/part-of: hausa-voice-swarm
spec:
  type: LoadBalancer
  selector:
    app: voice-pipeline
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
    - name: websocket
      port: 8765
      targetPort: websocket
      protocol: TCP
